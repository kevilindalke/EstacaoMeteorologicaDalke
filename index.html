<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Estação Meteorológica Dalke</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header>

<h1>🌦 Estação Meteorológica Dalke</h1>

<p>Santa Rita • Alto Paraná • Paraguay</p>

</header>

<main class="cards">

<div class="card">
<span>🌡</span>
<h2>Temperatura</h2>
<p id="temperatura">--.- °C</p>
</div>

<div class="card">
<span>💧</span>
<h2>Umidade</h2>
<p id="umidade">-- %</p>
</div>

<div class="card">
<span>📈</span>
<h2>Pressão</h2>
<p id="pressao">---- hPa</p>
</div>

<div class="card">
<span>🕒</span>
<h2>Hora</h2>
<p id="hora">--:--</p>
</div>

<div class="card">
<span>📅</span>
<h2>Data</h2>
<p id="data">--/--/----</p>
</div>

<div class="card">
<span>📶</span>
<h2>Status</h2>
<p id="status">Online</p>
</div>

</main>

<footer>

Projeto desenvolvido por Kevilin Dalke

</footer>

<script type="module" src="script.js"></script>

</body>
</html>
