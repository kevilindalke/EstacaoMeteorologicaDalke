<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estação Meteorológica Dalke</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🌤 Estação Meteorológica Dalke</h1>

    <p class="subtitulo">
        Santa Rita • Paraguai
    </p>

    <div class="card">
        <h2>📅 Data</h2>
        <p id="data">24/07/2026</p>
    </div>

    <div class="card">
        <h2>🕒 Hora</h2>
        <p id="hora">18:35</p>
    </div>

    <div class="card">
        <h2>🌡 Temperatura</h2>
        <p id="temp">24.8 °C</p>
    </div>

    <div class="card">
        <h2>💧 Umidade</h2>
        <p id="umidade">68 %</p>
    </div>

    <div class="card">
        <h2>📈 Pressão</h2>
        <p id="pressao">1013 hPa</p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
